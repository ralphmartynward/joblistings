name: Taleez Discovery (one-off)

on:
  workflow_dispatch:   # manual trigger only — this is a one-time research pass, not a recurring job

permissions:
  contents: write      # needed to push _taleez_discovery_output.json back to the repo

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Taleez discovery scan
        run: python scripts/taleez_discovery.py

      - name: Commit discovery results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _taleez_discovery_output.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: Taleez discovery results [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) — fetching and rebasing before retry..."
            git fetch origin
            git rebase origin/master
            sleep $((RANDOM % 5 + 1))
          done
          echo "Failed to push after retries" >&2
          exit 1
